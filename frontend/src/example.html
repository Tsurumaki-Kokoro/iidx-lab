<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IIDXLab SDK 示例</title><style>body{background:#f5f5f7;color:#1d1d1f;font:15px system-ui;margin:28px}#plot{overflow:auto}#stats svg{max-width:600px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>原生 ES Module 调用示例</h1><p>加载一张谱面，应用固定 RANDOM，计算统计，按小节渲染。无需框架或构建器。</p><button id="run">运行示例</button><pre id="status"></pre><div id="stats"></div><div id="plot"></div><script type="module">
import {createDataset, transform, analyze, renderChartSVG, renderStatsHTML} from './index.mjs';
const dataset=createDataset(new URL('./data/',import.meta.url));
document.getElementById('run').onclick=async()=>{try{const songs=await dataset.search('冥');const song=songs.find(s=>s.charts.some(c=>c.difficulty==='SPA'));const bundle=await dataset.loadChart(song.key,'SPA');const chart=transform(bundle.chart,'random','example-seed');const stats=analyze(chart);document.getElementById('status').textContent=`${bundle.metadata.title} / ${stats.note_heads} Notes / 峰值 ${stats.peak_rolling_1s_heads} NPS`;document.getElementById('stats').innerHTML=renderStatsHTML(chart,stats);document.getElementById('plot').innerHTML=renderChartSVG(chart,bundle.metadata.title);}catch(e){document.getElementById('status').textContent=e.message;}};
</script></html>
